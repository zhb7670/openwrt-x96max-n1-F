#==========================================================================
#  【V2 专用】Phicomm N1 (S905D) / X96Max+ (S905X3) OpenWrt 固件打包
#            —— ophub 官方流程 + DDNS-GO 修复
#
#  ★★ 本文件是 V2 的独立工作流，与 V1 彻底分离 ★★
#      - V1（build-v1.yml）: 纯 ophub 官方流程，那份文件里没有任何注入逻辑
#      - V2（本文件）      : 官方流程 + 注入 v2-inject/overlay
#    两份文件刻意保持独立。改其中一份不会影响另一份。
#    若要改公共流程（runner 版本 / 依赖清单 / 打包参数），请记得同步改另一份。
#
#  与 V1 的**唯一**差异，就是多了一步「注入定制 overlay」：
#    在「下载 rootfs」和「打包」之间，把 v2-inject/overlay 叠加进官方 rootfs。
#    其余步骤与 V1 逐字相同，这样才能保证"两版固件除了 DDNS-GO 之外完全一致"。
#
#  V2 注入清单（3 个文件，V2 专属目录，V1 从不引用）：
#    v2-inject/overlay/usr/lib/lua/luci/controller/ddns-go.lua
#    v2-inject/overlay/usr/lib/lua/luci/view/ddns-go/ddns-go.htm
#    v2-inject/overlay/etc/uci-defaults/99-ddns-go-fix
#
#  产出 4 个（文件名与 V1 完全相同，靠 Release tag 区分）：
#    openwrt_s905d_n1_R26.03.25_k6.12.112-flippy-95+o.img.gz
#    openwrt_s905d_n1_R26.03.25_k6.18.56-flippy-95+.img.gz
#    openwrt_s905x3_multi_R26.03.25_k6.12.112-flippy-95+o.img.gz
#    openwrt_s905x3_multi_R26.03.25_k6.18.56-flippy-95+.img.gz
#==========================================================================
name: "Build V2 - 官方流程 + DDNS-GO 修复"

on:
  workflow_dispatch:
    inputs:
      package_soc:
        description: "打包机型（下划线分隔）：s905d=N1，s905x3=X96Max+"
        required: true
        default: "s905d_s905x3"
      kernel_version:
        description: "内核系列（下划线分隔，各自解析为同系列最新）"
        required: true
        default: "6.12.y_6.18.y"
      auto_kernel:
        description: "自动取同系列最新内核（6.12.y→6.12.112 / 6.18.y→6.18.56）"
        required: true
        default: true
        type: boolean
      openwrt_ip:
        description: "固件默认 LAN IP"
        required: true
        default: "192.168.100.1"
      rootfs_asset:
        description: "rootfs 资产名（留空 = 自动取 ophub 最新的那个）"
        required: false
        default: "2026.02.20-openwrt-armsr-armv8-generic-rootfs.tar.gz"
      release_tag:
        description: "发布到哪个 Release tag（默认 V2）"
        required: true
        default: "V2"

env:
  TZ: Etc/UTC

# 与 V1 分开排队，互不干扰
concurrency:
  group: build-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      #------------------------------------------------------------------
      # 1. 环境准备
      #------------------------------------------------------------------
      - name: 初始化构建环境
        id: init
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -e
          sudo apt-get -y update
          # ophub 官方依赖清单（原配 ubuntu-26.04 runner）。这里在 24.04 上使用，
          # 并采用「先整批、失败再逐个」的策略，个别包名不匹配不影响整体。
          DEPS="$(curl -fsSL https://ophub.org/ubuntu2604-make-openwrt-depends 2>/dev/null || true)"
          if [ -z "${DEPS}" ]; then
            DEPS="bc cpio device-tree-compiler dosfstools e2fsprogs fdisk file gawk \
                  jq pigz qemu-utils rsync tar u-boot-tools unzip wget xfsprogs \
                  xz-utils zip zstd"
          fi
          # 去掉 shell 通配符（如 gcc-arm*），否则 apt 会整批失败
          DEPS="$(echo "${DEPS}" | tr ' ' '\n' | grep -v '\*' | tr '\n' ' ')"
          echo ">>> 依赖包数量: $(echo ${DEPS} | wc -w)"
          sudo apt-get -y install ${DEPS} && echo ">>> 整批安装成功" || {
            echo ">>> 整批未通过，改为逐个安装（个别包缺失不影响）"
            for p in ${DEPS}; do
              sudo apt-get -y install "$p" >/dev/null 2>&1 || echo "    [skip] $p"
            done
          }
          # mkfs.xfs 需要 xfsprogs，ophub 清单里没有，单独补
          sudo apt-get -y install xfsprogs >/dev/null 2>&1 || echo "    [skip] xfsprogs"
          echo ">>> 关键工具自检："
          for c in fdisk sfdisk losetup mkfs.xfs mkimage dtc pigz gzip xz zstd jq curl git tar; do
            printf "    %-10s : %s\n" "$c" "$(command -v $c 2>/dev/null || echo '缺失')"
          done
          echo "status=success" >> ${GITHUB_OUTPUT}

      #------------------------------------------------------------------
      # 2. 扩展磁盘：新建 xfs 镜像挂到 /builder，再把 /opt 指过去
      #------------------------------------------------------------------
      - name: 创建扩展磁盘
        id: disk
        if: steps.init.outputs.status == 'success'
        run: |
          set -e
          root_avail=$(df --block-size=1G / | awk 'NR==2 {print $4}')
          root_size=$(( root_avail - 4 ))
          [ "${root_size}" -gt 0 ] || { echo "空间不足: ${root_avail}G"; exit 1; }
          echo ">>> / 可用 ${root_avail}G，创建 ${root_size}G 扩展镜像"
          sudo truncate -s "${root_size}G" /root.img
          build_dev=$(sudo losetup --find --show /root.img)
          echo ">>> 回环设备: ${build_dev}"
          sudo mkfs.xfs -f -i sparse=0 -b size=4096 "${build_dev}"
          sudo mkdir -p /builder
          sudo mount "${build_dev}" /builder
          sudo chown -R runner:runner /builder
          # runner 是一次性环境，/opt 里没有系统关键内容；用 mv 而非 rm，便于回溯
          sudo mkdir -p /builder/opt
          if [ -e /opt ] && [ ! -L /opt ]; then sudo mv /opt /opt.orig; fi
          sudo ln -sfn /builder/opt /opt
          sudo chown -R runner:runner /builder/opt
          echo ">>> 挂载结果："
          df -Th / /builder /opt
          echo "status=success" >> ${GITHUB_OUTPUT}

      #------------------------------------------------------------------
      # 3. 下载 rootfs（用 ophub 现成的，不自己编译）
      #    openwrt_flippy.sh 只认文件名 openwrt-armsr-armv8-generic-rootfs.tar.gz
      #------------------------------------------------------------------
      - name: 下载 OpenWrt rootfs
        id: download
        if: steps.disk.outputs.status == 'success'
        working-directory: /builder
        run: |
          set -e
          mkdir -p opt/download
          ln -sfn /builder/opt ${{ github.workspace }}/opt
          ASSET="${{ inputs.rootfs_asset }}"
          if [ -z "${ASSET}" ]; then
            echo ">>> 未指定 rootfs，自动取 ophub 最新的一个"
            ASSET="$(curl -s \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/ophub/flippy-openwrt-actions/releases?per_page=30" \
              | jq -r '[.[] | select(.tag_name | contains("OpenWrt_armv8_rootfs"))]
                       | map(.assets[] | select(.name | endswith("-rootfs.tar.gz")))
                       | sort_by(.updated_at) | reverse | .[0].name')"
          fi
          echo ">>> 使用 rootfs: ${ASSET}"
          curl -fL --retry 5 --retry-delay 10 \
            -o opt/download/openwrt-armsr-armv8-generic-rootfs.tar.gz \
            "https://github.com/ophub/flippy-openwrt-actions/releases/download/OpenWrt_armv8_rootfs/${ASSET}"
          ls -l --block-size=1 opt/download/
          echo ">>> 官方 rootfs 指纹（注入前的原始值，留档对比）："
          sha256sum opt/download/openwrt-armsr-armv8-generic-rootfs.tar.gz
          echo "status=success" >> ${GITHUB_OUTPUT}

      #------------------------------------------------------------------
      # 3.5 【V2 专有】注入定制 overlay
      #
      #     这一步只存在于 V2 工作流。做法：
      #       解包官方 rootfs  ->  叠加 v2-inject/overlay  ->  用同名重新打包
      #     文件名不能变，因为 openwrt_flippy.sh 只认
      #     opt/download/openwrt-armsr-armv8-generic-rootfs.tar.gz。
      #------------------------------------------------------------------
      - name: 注入定制 overlay (V2)
        id: inject
        if: steps.download.outputs.status == 'success'
        working-directory: /builder
        run: |
          set -e
          SRC="${GITHUB_WORKSPACE}/v2-inject/overlay"
          if [ ! -d "${SRC}" ]; then
            echo ">>> 注入目录不存在：${SRC}"
            echo ">>> V2 必须注入，否则与 V1 无异 —— 直接失败，不产出误导性的固件"
            exit 1
          fi

          ROOTFS="opt/download/openwrt-armsr-armv8-generic-rootfs.tar.gz"
          WORK=/builder/inject-work
          sudo rm -rf "${WORK}" && sudo mkdir -p "${WORK}"

          echo ">>> 解包官方 rootfs ..."
          sudo tar -xzf "${ROOTFS}" -C "${WORK}" -p

          echo ">>> 叠加定制文件：v2-inject/overlay"
          echo "---------------- 注入清单 ----------------"
          ( cd "${SRC}" && find . -type f -printf '%M %8s  %p\n' | sort )
          echo "------------------------------------------"
          sudo cp -a "${SRC}/." "${WORK}/"

          # uci-defaults 下的脚本一律给执行位。
          # 不能依赖检出时的权限位：Windows 上 core.filemode=false，Git 记的
          # 恒为 644，cp -a 过来的还是 644；OpenWrt 官方本来也都是 755。
          if [ -d "${WORK}/etc/uci-defaults" ]; then
            sudo find "${WORK}/etc/uci-defaults" -maxdepth 1 -type f \
              -exec chmod 755 {} + 2>/dev/null || true
          fi

          echo ">>> 重新打包（保持原文件名）"
          sudo rm -f "${ROOTFS}"
          ( cd "${WORK}" && sudo tar -cpf - . ) | pigz -9 > "${ROOTFS}.new"
          mv "${ROOTFS}.new" "${ROOTFS}"
          ls -l --block-size=1 "${ROOTFS}"
          echo ">>> 归档自检：条目数 $(tar -tzf "${ROOTFS}" | wc -l)"

          echo ">>> ★ 注入结果逐项确认（任何一项缺失都会让下面 grep 失败）："
          for f in \
            "./usr/lib/lua/luci/controller/ddns-go.lua" \
            "./usr/lib/lua/luci/view/ddns-go/ddns-go.htm" \
            "./etc/uci-defaults/99-ddns-go-fix"
          do
            if tar -tzf "${ROOTFS}" | grep -qx -- "$f"; then
              echo "    OK   $f"
            else
              echo "    ✗ 缺失 $f"
              exit 1
            fi
          done
          echo ">>> 注入后 fingerprint："
          sha256sum "${ROOTFS}"

          echo "status=success" >> ${GITHUB_OUTPUT}

      #------------------------------------------------------------------
      # 4. 打包：直接调用本仓库根目录的 action（= ophub 的 openwrt_flippy.sh）
      #------------------------------------------------------------------
      - name: 打包固件
        uses: ./
        if: steps.inject.outputs.status == 'success'
        env:
          OPENWRT_ARMSR: opt/download/*rootfs.tar.gz
          PACKAGE_SOC: ${{ inputs.package_soc }}
          KERNEL_REPO_URL: ophub/kernel
          KERNEL_VERSION_NAME: ${{ inputs.kernel_version }}
          KERNEL_AUTO_LATEST: ${{ inputs.auto_kernel }}
          OPENWRT_IP: ${{ inputs.openwrt_ip }}
          WHOAMI: flippy
          GZIP_IMGS: gz
          SAVE_OPENWRT_ROOTFS: "false"

      #------------------------------------------------------------------
      # 5. 列产物 / 算 sha256 / 上传
      #------------------------------------------------------------------
      - name: 列出产物并生成校验文件
        if: always()
        run: |
          echo ">>> PACKAGED_STATUS     = ${{ env.PACKAGED_STATUS }}"
          echo ">>> PACKAGED_OUTPUTPATH = ${{ env.PACKAGED_OUTPUTPATH }}"
          if [ -n "${{ env.PACKAGED_OUTPUTPATH }}" ] && [ -d "${{ env.PACKAGED_OUTPUTPATH }}" ]; then
            cd "${{ env.PACKAGED_OUTPUTPATH }}"
            echo "---------------- 产物清单 ----------------"
            ls -l --block-size=1
            echo "---------------- sha256 ------------------"
            # 产物是 sudo 下的打包脚本生成的，属主是 root，普通重定向会被拒绝
            # （上一版就报过 "sha256sums.txt: Permission denied"），所以走 sudo tee
            sha256sum *.img.gz | sudo tee sha256sums.txt > /dev/null
            sudo chmod 644 sha256sums.txt
            cat sha256sums.txt
            echo "---------------- 磁盘 -------------------"
            df -h / /opt || true
          else
            echo ">>> 没有产物目录，打包未成功"
          fi

      - name: 上传 Artifact
        if: env.PACKAGED_STATUS == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-images-v2
          path: ${{ env.PACKAGED_OUTPUTPATH }}/*
          if-no-files-found: warn
          retention-days: 7

      #------------------------------------------------------------------
      # 6. 发布到 Release（说明固定取 docs/RELEASE_V2.md）
      #------------------------------------------------------------------
      - name: 发布到 Release
        if: env.PACKAGED_STATUS == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: "V2 - 官方流程 + DDNS-GO 修复"
          files: ${{ env.PACKAGED_OUTPUTPATH }}/*
          make_latest: true
          body_path: docs/RELEASE_V2.md
